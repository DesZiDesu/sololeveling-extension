<div id="sl-system-settings" class="sl-system-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header interactable" tabindex="0" role="button" aria-expanded="false">
            <b><i class="fa-solid fa-bolt" aria-hidden="true"></i> The System</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down" aria-hidden="true"></div>
        </div>
        <div class="inline-drawer-content">
            <p class="sl-system-settings-copy">Open the Solo Leveling system interface from the Extensions page or the wand menu.</p>

            <label class="checkbox_label" for="sl-system-show-launcher">
                <input id="sl-system-show-launcher" type="checkbox" />
                <span>Show <em>The System</em> in the wand menu</span>
            </label>

            <div class="sl-system-settings-note">
                <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                <span>This first build is the working interface shell. Persistent player state, skills, quests, and progression will be connected in the next layer.</span>
            </div>

            <div class="sl-system-settings-actions">
                <button id="sl-system-open-from-settings" class="menu_button" type="button">
                    <i class="fa-solid fa-up-right-from-square" aria-hidden="true"></i>
                    Open The System
                </button>
                <span class="sl-system-ready-state">
                    <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
                    Interface online
                </span>
            </div>
        </div>
    </div>
</div>
